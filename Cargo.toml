[workspace]
resolver = "3"
members = ["crates/ris-core", "crates/ris-store-sqlite", "crates/ris"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
ris-core = { path = "crates/ris-core" }
ris-store-sqlite = { path = "crates/ris-store-sqlite" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
toml = "0.8"
getrandom = "0.3"
anstyle = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
