[workspace]
resolver = "3"
members = ["crates/ris-core", "crates/ris-store-sqlite", "crates/ris"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
ris-core = { path = "crates/ris-core" }
ris-store-sqlite = { path = "crates/ris-store-sqlite" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
toml = "0.8"
getrandom = "0.3"
anstyle = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
rustix = { version = "1", features = ["process"] }
schemars = "1"
jsonschema = { version = "0.61", default-features = false }
# The map's parser: one engine and a grammar per language it reads.
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-clojure-orchard = "0.2"
# Runs the map page's script in a test, with no browser (D-115).
boa_engine = "0.22"
