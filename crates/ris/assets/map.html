<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ris map</title>
<style>
  :root {
    --ground: #06070d;
    --panel: rgba(12, 14, 26, 0.86);
    --line: #1c2140;
    --text: #cdd6ff;
    --faint: #6b7499;
    --modified: #00e5ff;
    --added: #39ff88;
    --deleted: #ff3d6e;
    --unchanged: #56607f;
    --outside: #ff2bd6;
    --pane: min(52vw, 860px);
    --pane-ground: #080a14;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #0d1024 0%, var(--ground) 70%);
    color: var(--text);
    font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow: hidden;
  }
  svg { display: block; width: 100vw; height: 100vh; cursor: grab; }
  svg:active { cursor: grabbing; }
  /* With the pane open the graph keeps the rest of the window. */
  body.paned svg { width: calc(100vw - var(--pane)); }
  body.paned header { max-width: calc(100vw - var(--pane) - 50px); }
  header, #legend, #tip {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 12px;
  }
  header { top: 12px; left: 12px; max-width: 70vw; }
  header h1 {
    margin: 0 0 2px;
    font-size: 14px;
    font-weight: 600;
    color: var(--modified);
    text-shadow: 0 0 8px rgba(0, 229, 255, 0.7);
  }
  header p { margin: 0; color: var(--faint); }
  header b { color: var(--text); font-weight: 500; }
  #legend { bottom: 12px; left: 12px; color: var(--faint); }
  #legend div { display: flex; align-items: center; gap: 8px; }
  #legend i {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    box-sizing: border-box;
  }
  #tip {
    pointer-events: none;
    display: none;
    max-width: 60vw;
    box-shadow: 0 0 18px rgba(0, 229, 255, 0.18);
  }
  #tip .path { color: var(--text); word-break: break-all; }
  #tip .plus { color: var(--added); }
  #tip .minus { color: var(--deleted); }
  #tip .outside { color: var(--outside); }
  #tip .quiet { color: var(--faint); }
  .link { stroke: #2b3566; stroke-opacity: 0.5; stroke-width: 1; }
  .link.mod { stroke-dasharray: 3 3; }
  .link.lit { stroke: var(--modified); stroke-opacity: 0.95; stroke-width: 1.4; }
  .node circle { stroke-width: 0; }
  .node.outside circle { stroke: var(--outside); stroke-width: 2; }
  .node text {
    fill: var(--text);
    font-size: 10px;
    pointer-events: none;
    paint-order: stroke;
    stroke: var(--ground);
    stroke-width: 3px;
  }
  .node.unchanged { opacity: 0.3; }
  .node.unchanged.outside { opacity: 0.55; }
  .dim .node:not(.lit) { opacity: 0.08; }
  .dim .link:not(.lit) { stroke-opacity: 0.06; }
  .node.lit { opacity: 1; }
  .node { cursor: pointer; }
  .node.picked { opacity: 1; }
  .node.picked circle { stroke: #ffffff; stroke-width: 2.5; }

  /* The diff pane: one file's change, beside the graph. */
  #pane {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: var(--pane);
    display: none;
    flex-direction: column;
    background: var(--pane-ground);
    border-left: 1px solid var(--line);
    box-shadow: -14px 0 36px rgba(0, 0, 0, 0.55), -1px 0 14px rgba(0, 229, 255, 0.12);
  }
  body.paned #pane { display: flex; }
  #pane-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: rgba(12, 14, 26, 0.9);
  }
  #pane-file { flex: 1; min-width: 0; }
  #pane-path {
    color: var(--text);
    font-weight: 600;
    word-break: break-all;
    text-shadow: 0 0 8px rgba(0, 229, 255, 0.35);
  }
  #pane-totals { color: var(--faint); }
  #pane-totals .plus { color: var(--added); }
  #pane-totals .minus { color: var(--deleted); }
  #pane-totals .outside { color: var(--outside); }
  #pane-close {
    flex: none;
    font: inherit;
    color: var(--faint);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
  }
  #pane-close:hover, #pane-close:focus-visible {
    color: var(--modified);
    border-color: var(--modified);
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.35);
    outline: none;
  }
  /* Long lines and long diffs scroll here, not the page. */
  #pane-body { flex: 1; overflow: auto; font-size: 12px; line-height: 1.5; tab-size: 4; }
  #pane-body::-webkit-scrollbar { width: 10px; height: 10px; }
  #pane-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  #pane-body::-webkit-scrollbar-corner { background: transparent; }
  .diff { display: inline-block; min-width: 100%; padding-bottom: 16px; }
  .diff .row { display: flex; }
  /* The line numbers stay put while a long line scrolls sideways. */
  .diff .gutter {
    position: sticky;
    left: 0;
    flex: none;
    display: flex;
    background: var(--pane-ground);
    border-right: 1px solid var(--line);
    color: var(--faint);
    user-select: none;
  }
  .diff .num { width: 5ch; padding: 0 6px; text-align: right; }
  .diff .sign { flex: none; width: 2ch; text-align: center; color: var(--faint); user-select: none; }
  .diff .code { flex: 1; white-space: pre; padding-right: 16px; }
  .diff .add { background: rgba(57, 255, 136, 0.09); }
  .diff .add .gutter { background: #0b1d18; }
  .diff .add .sign, .diff .add .num { color: var(--added); }
  .diff .add .code { color: #d3ffe4; }
  .diff .del { background: rgba(255, 61, 110, 0.11); }
  .diff .del .gutter { background: #1e0c17; }
  .diff .del .sign, .diff .del .num { color: var(--deleted); }
  .diff .del .code { color: #ffd3dd; }
  .diff .hunk { background: rgba(0, 229, 255, 0.07); border-top: 1px solid var(--line); }
  .diff .hunk:first-child { border-top: 0; }
  .diff .hunk .gutter { background: #0a1626; }
  .diff .hunk .code { color: var(--modified); padding: 2px 16px 2px 0; }
  .diff .note .code { color: var(--faint); font-style: italic; }
  #pane-body p { margin: 0; padding: 14px; color: var(--faint); }
</style>
</head>
<body>
<header>
  <h1 id="title">change set</h1>
  <p id="range"></p>
  <p id="totals"></p>
  <p id="tests"></p>
</header>
<svg id="map" role="img" aria-label="The phase's change set drawn over the source files">
  <defs>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>
  <g id="view">
    <g id="links"></g>
    <g id="nodes"></g>
  </g>
</svg>
<div id="legend">
  <div><i style="background: var(--modified)"></i>modified in the phase</div>
  <div><i style="background: var(--added)"></i>added</div>
  <div><i style="background: var(--deleted)"></i>deleted</div>
  <div><i style="background: var(--unchanged)"></i>unchanged</div>
  <div><i style="border: 2px solid var(--outside)"></i>touches the outside, or a contract</div>
  <div>size: lines added and removed; an unchanged file is a dot</div>
  <div>drag a file, scroll to zoom, hover for its numbers, click for its diff</div>
</div>
<aside id="pane" aria-label="The picked file's diff for the phase">
  <div id="pane-head">
    <div id="pane-file">
      <div id="pane-path"></div>
      <div id="pane-totals"></div>
    </div>
    <button id="pane-close" type="button" title="Close the diff (Esc)">esc &#x2715;</button>
  </div>
  <div id="pane-body" tabindex="0"></div>
</aside>
<div id="tip"></div>
<script id="map-data" type="application/json">/*DATA*/</script>
<script>/*D3*/</script>
<script>
(function () {
  "use strict";
  // The page holds nothing the document does not: everything drawn is
  // read from it here.
  var doc = JSON.parse(document.getElementById("map-data").textContent);
  var nodes = doc.nodes.map(function (n) { return Object.assign({ id: n.path }, n); });
  var links = doc.edges.map(function (e) {
    return { source: e.from, target: e.to, kind: e.kind };
  });

  var short = function (sha) { return sha ? sha.slice(0, 10) : "unknown"; };
  document.getElementById("title").textContent =
    (doc.phase ? doc.phase + ": " : "") + "change set over the source";
  document.getElementById("range").textContent =
    short(doc.base) + " .. " + short(doc.tip) + " (" + doc.tip_ref + ")";
  var t = doc.totals;
  document.getElementById("totals").textContent =
    t.changed + " of " + t.files + " files changed, +" + t.added + " -" + t.removed +
    ", " + t.outside + " touch the outside";
  // Tests verify the behaviour and are not drawn; one line says what
  // the phase did to them.
  document.getElementById("tests").textContent =
    t.tests.files + " test file(s) left off the map: " + t.tests.changed +
    " changed (+" + t.tests.added + " -" + t.tests.removed + ")";

  var isOutside = function (n) { return n.contract || n.external.length > 0; };
  // A node's size shows its diff and nothing else: the lines added plus
  // removed, on a log scale against the phase's largest change, so an
  // unchanged file is a dot and the largest change the largest node.
  // Touching the outside or being a contract is the ring, not the size.
  var DOT = 2, SMALLEST = 5, LARGEST = 22;
  var lines = function (n) { return n.added + n.removed; };
  var most = d3.max(nodes, lines) || 0;
  var radius = function (n) {
    var d = lines(n);
    if (d === 0 || most === 0) { return n.status === "unchanged" ? DOT : SMALLEST; }
    return SMALLEST + (LARGEST - SMALLEST) * Math.log1p(d) / Math.log1p(most);
  };
  var colour = {
    modified: "var(--modified)",
    added: "var(--added)",
    deleted: "var(--deleted)",
    unchanged: "var(--unchanged)"
  };
  var base = function (path) { return path.slice(path.lastIndexOf("/") + 1); };

  var svg = d3.select("#map");
  var view = d3.select("#view");
  var width = window.innerWidth, height = window.innerHeight;

  var link = d3.select("#links").selectAll("line").data(links).join("line")
    .attr("class", function (l) { return "link " + l.kind; });

  var node = d3.select("#nodes").selectAll("g").data(nodes).join("g")
    .attr("class", function (n) {
      return "node " + n.status + (isOutside(n) ? " outside" : "");
    });
  node.append("circle")
    .attr("r", radius)
    .attr("fill", function (n) { return colour[n.status] || colour.unchanged; })
    .attr("filter", function (n) { return n.status === "unchanged" ? null : "url(#glow)"; });
  var labelled = function (n) { return n.status !== "unchanged" || isOutside(n); };
  node.filter(labelled)
    .append("text")
    .attr("x", function (n) { return radius(n) + 4; })
    .attr("y", 3)
    .text(function (n) { return base(n.path); });

  // Spread out, since the view zooms: long links, strong repulsion, and
  // a collision margin that leaves room for a label beside its node.
  var margin = function (n) { return radius(n) + (labelled(n) ? 16 : 6); };
  var draw = function () {
    link
      .attr("x1", function (l) { return l.source.x; })
      .attr("y1", function (l) { return l.source.y; })
      .attr("x2", function (l) { return l.target.x; })
      .attr("y2", function (l) { return l.target.y; });
    node.attr("transform", function (n) { return "translate(" + n.x + "," + n.y + ")"; });
  };
  var sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(function (n) { return n.id; })
      .distance(function (l) { return 90 + margin(l.source) + margin(l.target); })
      .strength(0.25))
    .force("charge", d3.forceManyBody().strength(function (n) { return -320 - 14 * radius(n); }))
    .force("collide", d3.forceCollide().radius(margin).strength(0.9))
    .force("x", d3.forceX(width / 2).strength(0.02))
    .force("y", d3.forceY(height / 2).strength(0.02))
    .on("tick", draw)
    .stop();

  var zoom = d3.zoom().scaleExtent([0.05, 8]).on("zoom", function (event) {
    view.attr("transform", event.transform);
  });
  svg.call(zoom);

  // Fit the whole graph, labels included, to the window.
  var fit = function () {
    if (nodes.length === 0) { return; }
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    node.each(function (n) {
      var box = this.getBBox();
      x0 = Math.min(x0, n.x + box.x); y0 = Math.min(y0, n.y + box.y);
      x1 = Math.max(x1, n.x + box.x + box.width); y1 = Math.max(y1, n.y + box.y + box.height);
    });
    var pad = 24;
    var top = document.querySelector("header").getBoundingClientRect().bottom;
    var w = width - 2 * pad, h = height - top - 2 * pad;
    var k = Math.min(w / Math.max(x1 - x0, 1), h / Math.max(y1 - y0, 1), 2);
    var tx = pad + (w - k * (x1 - x0)) / 2 - k * x0;
    var ty = top + pad + (h - k * (y1 - y0)) / 2 - k * y0;
    svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
  };

  // Settle the layout before the first frame, so the page opens on the
  // whole graph already fitted rather than on nodes still flying apart.
  var settle = Math.ceil(Math.log(sim.alphaMin()) / Math.log(1 - sim.alphaDecay()));
  for (var i = 0; i < settle; i += 1) { sim.tick(); }
  draw();
  fit();

  node.call(d3.drag()
    .on("start", function (event, n) {
      if (!event.active) { sim.alphaTarget(0.3).restart(); }
      n.fx = n.x; n.fy = n.y;
    })
    .on("drag", function (event, n) { n.fx = event.x; n.fy = event.y; })
    .on("end", function (event, n) {
      if (!event.active) { sim.alphaTarget(0); }
      n.fx = null; n.fy = null;
    }));

  // Hover: the file's path and diff numbers, and its connections lit.
  var tip = document.getElementById("tip");
  var line = function (cls, text) {
    var div = document.createElement("div");
    if (cls) { div.className = cls; }
    div.textContent = text;
    tip.appendChild(div);
    return div;
  };
  var place = function (event) {
    var x = event.clientX + 14, y = event.clientY + 14;
    tip.style.left = Math.min(x, window.innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = Math.min(y, window.innerHeight - tip.offsetHeight - 8) + "px";
  };
  node
    .on("mouseenter", function (event, n) {
      tip.textContent = "";
      line("path", n.path);
      var diff = line("", "");
      var plus = document.createElement("span");
      plus.className = "plus";
      plus.textContent = "+" + n.added;
      var minus = document.createElement("span");
      minus.className = "minus";
      minus.textContent = " -" + n.removed;
      var status = document.createElement("span");
      status.className = "quiet";
      status.textContent = "  " + n.status;
      diff.appendChild(plus); diff.appendChild(minus); diff.appendChild(status);
      if (n.external.length > 0) { line("outside", "touches: " + n.external.join(", ")); }
      if (n.contract) { line("outside", "a contract or format"); }
      tip.style.display = "block";
      place(event);
      var near = new Set([n.id]);
      link.classed("lit", function (l) {
        var hit = l.source.id === n.id || l.target.id === n.id;
        if (hit) { near.add(l.source.id); near.add(l.target.id); }
        return hit;
      });
      node.classed("lit", function (m) { return near.has(m.id); });
      svg.classed("dim", true);
    })
    .on("mousemove", place)
    .on("mouseleave", function () {
      tip.style.display = "none";
      svg.classed("dim", false);
      link.classed("lit", false);
      node.classed("lit", false);
    });

  // Click: the file's diff for the phase, in a pane beside the graph.
  // The pane draws only what the document holds: `diffs` has each
  // changed file's unified diff, as git writes it.
  var pane = document.getElementById("pane");
  var paneBody = document.getElementById("pane-body");
  var picked = null;
  var span = function (cls, text) {
    var s = document.createElement("span");
    s.className = cls;
    s.textContent = text;
    return s;
  };
  var row = function (cls, was, now, sign, text) {
    var r = document.createElement("div");
    r.className = "row " + cls;
    var gutter = span("gutter", "");
    gutter.appendChild(span("num", was));
    gutter.appendChild(span("num", now));
    r.appendChild(gutter);
    r.appendChild(span("sign", sign));
    r.appendChild(span("code", text));
    return r;
  };
  var say = function (text) {
    var p = document.createElement("p");
    p.textContent = text;
    paneBody.appendChild(p);
  };
  // A unified diff as rows: the file header is left out (the pane's
  // head names the file), each hunk header starts the old and new line
  // numbers, and each line after it is added, removed or context.
  var HUNK = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/;
  var rows = function (text) {
    var out = document.createElement("div");
    out.className = "diff";
    var all = text.split("\n");
    if (all[all.length - 1] === "") { all.pop(); }
    var was = 0, now = 0, inHunk = false;
    all.forEach(function (l) {
      var m = HUNK.exec(l);
      if (m) {
        was = Number(m[1]); now = Number(m[2]); inHunk = true;
        out.appendChild(row("hunk", "", "", "", l));
        return;
      }
      if (!inHunk) {
        if (l.indexOf("Binary files ") === 0) { out.appendChild(row("note", "", "", "", l)); }
        return;
      }
      var mark = l.charAt(0), rest = l.slice(1);
      if (mark === "+") {
        out.appendChild(row("add", "", now, "+", rest)); now += 1;
      } else if (mark === "-") {
        out.appendChild(row("del", was, "", "-", rest)); was += 1;
      } else if (mark === "\\") {
        // Git's remark that the file does not end in a newline.
        out.appendChild(row("note", "", "", "", rest.trim()));
      } else {
        out.appendChild(row("ctx", was, now, "", rest)); was += 1; now += 1;
      }
    });
    return out;
  };
  var show = function (n) {
    document.getElementById("pane-path").textContent = n.path;
    var totals = document.getElementById("pane-totals");
    totals.textContent = "";
    totals.appendChild(span("plus", "+" + n.added));
    totals.appendChild(span("minus", " -" + n.removed));
    totals.appendChild(span("", "  " + n.status));
    var marks = n.external.slice();
    if (n.contract) { marks.push("contract"); }
    if (marks.length > 0) { totals.appendChild(span("outside", "  " + marks.join(", "))); }
    paneBody.textContent = "";
    var text = (doc.diffs || {})[n.path];
    if (n.status === "unchanged") {
      say("Unchanged in the phase.");
    } else if (text === undefined) {
      say("The document holds no diff for this file.");
    } else {
      var diff = rows(text);
      if (diff.childNodes.length === 0) {
        say("No line changed: the file is empty, or only its mode changed.");
      } else {
        paneBody.appendChild(diff);
      }
    }
    paneBody.scrollTop = 0;
    paneBody.scrollLeft = 0;
  };
  // The graph's share of the window: all of it, less the open pane.
  var room = function () {
    width = window.innerWidth - (picked ? pane.getBoundingClientRect().width : 0);
    height = window.innerHeight;
  };
  var pick = function (n) {
    var wasOpen = picked !== null;
    picked = n;
    document.body.classList.toggle("paned", n !== null);
    node.classed("picked", function (m) { return m === n; });
    if (n !== null) { show(n); }
    // Opening and closing change the graph's room, so it is fitted
    // again; swapping one file for another leaves the view as it is.
    if (wasOpen !== (n !== null)) { room(); fit(); }
  };
  // A drag ends without a click, so moving a node does not open it.
  node.on("click", function (event, n) {
    if (!event.defaultPrevented) { pick(n); }
  });
  document.getElementById("pane-close").addEventListener("click", function () { pick(null); });
  window.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && picked !== null) { pick(null); }
  });

  window.addEventListener("resize", function () {
    room();
    fit();
  });
}());
</script>
</body>
</html>
