[package]
name = "ris"
description = "osiris: the command-line interface. Hosts the core; the daemon comes later."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ris"
path = "src/main.rs"

[dependencies]
# With the schema of its serialised types: the `--json` contract's
# schema is generated from them.
ris-core = { workspace = true, features = ["schema"] }
ris-store-sqlite.workspace = true
clap.workspace = true
serde_json.workspace = true
sha2.workspace = true
serde.workspace = true
toml.workspace = true
getrandom.workspace = true
anstyle.workspace = true
crossterm.workspace = true
rustix.workspace = true
schemars.workspace = true

[dev-dependencies]
jsonschema.workspace = true
serde_json.workspace = true
ris-core.workspace = true
