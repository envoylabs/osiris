[package]
name = "ris"
description = "osiris: the command-line interface. Hosts the core; the daemon comes later."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ris"
path = "src/main.rs"

[features]
# `ris map` opens its page in a native window (D-138). Off by default,
# so the command line builds with no web view and none of the system
# packages one needs; the person's ris is built with it by `--features
# window` in the build command of `[install]`.
window = ["dep:ris-window"]

[dependencies]
ris-window = { workspace = true, optional = true }
# With the schema of its serialised types: the `--json` contract's
# schema is generated from them.
ris-core = { workspace = true, features = ["schema"] }
ris-store-sqlite.workspace = true
clap.workspace = true
serde_json.workspace = true
sha2.workspace = true
serde.workspace = true
toml.workspace = true
getrandom.workspace = true
anstyle.workspace = true
crossterm.workspace = true
rustix.workspace = true
schemars.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-go.workspace = true
tree-sitter-clojure-orchard.workspace = true

[dev-dependencies]
jsonschema.workspace = true
serde_json.workspace = true
ris-core.workspace = true
boa_engine.workspace = true
