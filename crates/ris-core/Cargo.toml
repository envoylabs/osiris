[package]
name = "ris-core"
description = "osiris: the pure core. Primitives, transitions, the event log's fold and chain."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
regex.workspace = true
toml.workspace = true
schemars = { workspace = true, optional = true }

[features]
# JSON Schema for the serialised types, for the shell's `--json`
# contract. Derives only: the core's behaviour does not change.
schema = ["dep:schemars"]
