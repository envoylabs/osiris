# The standing checks from .osiris/checks.toml, plus the exit scan over
# the tree and, on the main line, the check that the rules file is
# current. The toolchain comes from rust-toolchain.toml, which rustup
# (preinstalled on GitHub's runners) reads, so CI and a local run use the
# same compiler, clippy and rustfmt.
#
# The scan here applies the built-in patterns only: the denylist lives in
# each machine's .osiris/config.toml, which is never committed.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # ris refuses every command with RIS_AGENT unset.
      RIS_AGENT: person
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: a test draws the map page over the last
          # closed phase, which it reads from the closing merge.
          fetch-depth: 0

      - name: toolchain
        # Installs what rust-toolchain.toml names, then prints it.
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: system packages
        # The map page's window (crates/ris-window) holds the system's
        # web view, which on Linux is WebKitGTK: its development package
        # brings GTK's with it.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev

      - name: build
        run: cargo build --workspace

      - name: test
        # --no-fail-fast so one failing test file cannot hide others.
        run: cargo test --workspace --no-fail-fast

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: fmt
        run: cargo fmt --all --check

      - name: with the window
        # ris opens the window only when built with its `window`
        # feature, which the steps above leave off: here that build is
        # linted and tested too. No test opens a window.
        run: |
          cargo clippy -p ris --features window --all-targets -- -D warnings
          cargo test -p ris --features window --no-fail-fast

      - name: scan
        # The step above built ris again with the window: build the
        # plain one, which is what the workspace's checks cover.
        run: |
          cargo build -p ris
          ./target/debug/ris init --local
          ./target/debug/ris scan

      - name: rules file
        # The main line's rules file is what the rules and the project's
        # part render, by the ris built from this tree, which holds the
        # rules. Only there: a phase's branch may hold the file behind
        # its sources until `ris phase close` renders it into the
        # closing merge, so no seat's change to the rules waits on it.
        if: github.ref == 'refs/heads/main'
        run: ./target/debug/ris rules --render docs/project-rules.md --to AGENTS.md --check
